name: Public Repository CI

on:
  push:
    branches: [ main, phase3-long-horizon-adaptation ]
  pull_request:
    branches: [ main, phase3-long-horizon-adaptation ]

jobs:
  public-validation:
    name: Public-Safe Tests & Integrity Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Public-Safe Test Suite (Units, Parity, Causal Invariants, Controls)
        run: |
          echo "=== RUNNING PUBLIC CI (DELTAX_LOCAL_RUNTIME_CMD unset) ==="
          echo "Note: Private runtime tests requiring deltax-python-runtime are skipped in public CI."
          node --test test/*.test.mjs

      - name: Run Repository Boundary & Leak Scan
        run: |
          echo "=== SCANNING FOR PROPRIETARY STRINGS OR CREDENTIALS ==="
          python3 -c '
          import os, sys, re
          FORBIDDEN = [
              re.compile(r"/Users/[a-zA-Z0-9_-]+/Projects/private/deltax-python-runtime", re.I),
              re.compile(r"ghp_[a-zA-Z0-9]{36}"),
              re.compile(r"xox[baprs]-[0-9a-zA-Z]+"),
          ]
          violations = 0
          for root, dirs, files in os.walk("."):
              if ".git" in dirs: dirs.remove(".git")
              if "node_modules" in dirs: dirs.remove("node_modules")
              if "artifacts/changed_world/phase3_pre_integrity_audit" in root: continue
              for f in files:
                  path = os.path.join(root, f)
                  try:
                      with open(path, "r", errors="ignore") as fh:
                          for idx, line in enumerate(fh, 1):
                              for pat in FORBIDDEN:
                                  if pat.search(line):
                                      print(f"LEAK VIOLATION: {path}:{idx}")
                                      violations += 1
                  except Exception:
                      pass
          if violations > 0:
              sys.exit(1)
          print("Leak scan passed cleanly (0 violations).")
          '
